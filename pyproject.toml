[project]
name = "tjm-labs-grounding-agent"
version = "0.1.0"
description = "Vision-based desktop automation agent using VLM grounding to locate and interact with desktop icons"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pywin32>=312",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
